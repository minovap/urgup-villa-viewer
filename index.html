<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ürgüp Villa Model</title>
<style>
  :root {
    --bg: #15171a; --panel: rgba(22,24,28,.92); --line: #2c3036; --text: #e4e6ea;
    --muted: #8d939c; --accent: #d9b26a; --btn: #23272d; --btn-h: #2e333a; --on: #3a3f47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; width: 300px; max-height: calc(100% - 20px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px;
    backdrop-filter: blur(6px); z-index: 5; }
  #panel h1 { font-size: 14px; margin: 0 0 2px; font-weight: 600; letter-spacing: .02em; }
  #panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; word-break: break-all; }
  #panel h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
    margin: 12px 0 6px; font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  button { background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 9px; font: inherit; cursor: pointer; min-height: 30px; }
  button:hover { background: var(--btn-h); }
  button.on { background: var(--on); border-color: var(--accent); color: #fff; }
  label.tg { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  label.tg input { accent-color: var(--accent); width: 16px; height: 16px; }
  label.tg .meta { color: var(--muted); font-size: 11px; margin-left: auto; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; }
  .row span { min-width: 70px; }
  #status { margin-top: 10px; color: var(--muted); font-size: 11px; min-height: 1.3em; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; color: var(--text); z-index: 4;
    font-size: 12px; max-width: calc(100% - 24px); text-align: center; display: none; }
  #toggle { position: fixed; top: 10px; left: 10px; z-index: 6; display: none; }
  #measureOut { color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 6px; font-size: 12px; }
  .mlabel { background: rgba(15,16,18,.85); color: #ffd98a; border: 1px solid #6b5a33; padding: 2px 6px;
    border-radius: 5px; font: 600 12px/1.3 -apple-system, sans-serif; white-space: nowrap; pointer-events: none; }
  #load { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7; display: flex; flex-direction: column;
    align-items: center; gap: 12px; min-width: 240px; white-space: nowrap; max-width: calc(100% - 40px); padding: 20px 26px 18px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--text); pointer-events: none; font-size: 13px; }
  #load::before { content: ""; width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #ptinfo { position: fixed; top: 10px; right: 10px; z-index: 4; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; font-variant-numeric: tabular-nums; display: none; }
  .sub2 { margin-left: 14px; }
  .sunrow { display: flex; align-items: center; gap: 6px; }
  .sunrow input[type=range] { flex: 1; min-width: 0; }
  .sunrow .val { color: var(--text); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 92px; text-align: right; }
  .sunrow button { min-height: 24px; padding: 2px 7px; font-size: 11px; }
  #sunInfo { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #north { position: fixed; right: 14px; bottom: 14px; width: 58px; height: 58px; z-index: 4; cursor: pointer;
    border-radius: 50%; background: var(--panel); border: 1px solid var(--line); padding: 0; min-height: 0; }
  #north:hover { border-color: var(--accent); }
  #north svg { width: 100%; height: 100%; display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; z-index: 4;
    border: 1.5px solid rgba(255,255,255,.8); border-radius: 50%; display: none; pointer-events: none; }
  .dllist { display: flex; flex-direction: column; gap: 5px; }
  .dlrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .dlname { font-size: 12.5px; }
  .dllist .dlb { display: inline-flex; align-items: center; gap: 4px; background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 7px; padding: 3px 8px; min-height: 26px; font-weight: 600; font-size: 11.5px; }
  .dllist .dlb:hover { background: rgba(217,178,106,.14); }
  .dllist .ic { width: 15px; height: 15px; flex: none; }
  .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .vcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .vcol button { width: 100%; }
  .dlb { background: var(--accent); color: #1b1610; border-color: var(--accent); font-weight: 600; font-size: 12px; min-height: 28px; padding: 4px 6px; }
  .dlb:hover { background: #e6c587; }
  .dlb:disabled { opacity: .6; cursor: default; }
  .dli { font-size: 13px; }
  .dlnote { color: var(--muted); font-size: 10.5px; margin-top: 4px; }
  #lang { display: flex; gap: 6px; margin: 0 0 10px; }   /* top of the sidebar */
  #lang button { width: 40px; height: 28px; min-height: 0; padding: 3px; display: grid; place-items: center; opacity: .55; }
  #lang button.on { opacity: 1; }
  #lang svg { width: 100%; height: 100%; display: block; border-radius: 2px; }
  #ptinfo { top: 48px; }
  #verbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center;
    gap: 8px; padding: 6px 8px 6px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0,0,0,.35); white-space: nowrap; }
  #verbar .vlabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
  #variants { display: flex; gap: 4px; }
  #variants button { border-radius: 999px; padding: 6px 14px; position: relative; overflow: hidden; --p: 0%; }
  #variants button::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--p); background: rgba(217,178,106,.42);
    pointer-events: none; transition: width .25s linear, opacity .8s ease; opacity: 0; }
  #variants button.loading::after { opacity: 1; }
  #variants button.loaded::after { opacity: 0; width: 100%; }
  #hint { bottom: 72px; }
  @media (max-width: 640px) {
    #verbar { left: 0; right: 0; bottom: 0; transform: none; border-radius: 0; border: 0; border-top: 1px solid rgba(255,255,255,.12);
      background: rgba(15,16,18,.35); box-shadow: none; justify-content: center; gap: 6px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
    #verbar .vlabel { display: none; }
    #variants { flex: 1; max-width: 480px; }
    #variants button { flex: 1; padding: 8px 4px; min-height: 38px; background: rgba(35,39,45,.7); white-space: normal; line-height: 1.15; }
    #variants button.on { background: rgba(58,63,71,.9); }
    #north { bottom: 70px; }
    #hint { bottom: 70px; }
    #panel { width: auto; right: 10px; top: 52px; max-height: 55%; }
    #panel.hidden { display: none; }
    #toggle { display: block; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js",
    "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.20/build/index.module.js"
  }
}
</script>
</head>
<body>
<!-- model version switch: floating at the bottom centre on desktop, a transparent bar stuck to the bottom on phones -->
<div id="verbar">
  <span class="vlabel" data-i18n="modelHdr">Model</span>
  <div id="variants">
    <button data-variant="orig" data-i18n="vOrig">Mevcut bahçe</button>
    <button data-variant="v1" class="on" data-i18n="vV1">Bahçe önerisi v1</button>
    <button data-variant="v2" data-i18n="vV2">Bahçe önerisi v2</button>
  </div>
</div>

<canvas id="c"></canvas>
<div id="load" data-i18n="loading">Model yükleniyor...</div>
<div id="cross"></div>
<button id="toggle" data-i18n="menu">Menü</button>

<div id="panel">
<div id="lang" role="group" aria-label="Language">
  <button data-lang="tr" title="Türkçe" aria-label="Türkçe"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#e30a17"/><circle cx="11" cy="10" r="5" fill="#fff"/><circle cx="12.25" cy="10" r="4" fill="#e30a17"/><polygon fill="#fff" points="15.2,10 18.9,8.8 16.6,11.95 16.6,8.05 18.9,11.2"/></svg></button>
  <button data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30"><clipPath id="ukc"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukc)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></button>
</div>
  <h1 data-i18n="title">Ürgüp Villa</h1>
  <div class="sub" data-i18n="subtitle">3B model · Ürgüp, Nevşehir</div>

  <h2 data-i18n="dlBlend">Blender indir</h2>
  <div class="dllist">
    <div class="dlrow"><span class="dlname" data-i18n="vOrig">Mevcut bahçe</span>
      <button class="dlb" data-dl="orig" title=".blend"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="14" cy="13" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="13" r="2.2" fill="currentColor"/><path d="M2.5 9.5 L10 9.5 M5 5.5 L12.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l4.5 4.5v14.5H6z M14 2.5V7h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="dlt">.blend</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11 M7 10.5l5 5 5-5 M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="dlrow"><span class="dlname" data-i18n="vV1">Bahçe önerisi v1</span>
      <button class="dlb" data-dl="v1" title=".blend"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="14" cy="13" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="13" r="2.2" fill="currentColor"/><path d="M2.5 9.5 L10 9.5 M5 5.5 L12.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l4.5 4.5v14.5H6z M14 2.5V7h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="dlt">.blend</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11 M7 10.5l5 5 5-5 M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>

  </div>
  <div class="dlnote" id="dlNote" data-i18n="dlNote">.blend (zip, ~25–35 MB) · Blender 4.2+</div>

  <h2 data-i18n="look" style="display:none">Görünüm</h2>
  <div class="grid" id="modes">
    <button data-mode="rendered" class="on" data-i18n="rendered" style="display:none">Gerçekçi</button>
  </div>

  <h2 data-i18n="sun">Güneş</h2>
  <div class="sunrow"><input type="range" id="rTime" min="0" max="1440" step="15" value="840" data-i18n-aria="timeOfDay" aria-label="Günün saati">
    <span class="val" id="sunWhen">-</span></div>
  <div class="sunrow"><input type="range" id="rWeek" min="1" max="52" step="1" value="26" data-i18n-aria="weekOfYear" aria-label="Yılın haftası">

  <div id="sunInfo"><span id="weekLbl">-</span></div>

  <h2 data-i18n="views">Bakış noktaları</h2>
  <div class="grid" id="views"></div>

  <h2 data-i18n="nav">Gezinme</h2>
  <div class="grid">
    <button id="bOrbit" class="on" data-i18n="orbit">Döndür</button>
    <button id="bWalk" data-i18n="walk">Yürü</button>
  </div>
  <label class="tg" style="margin-top:8px"><input type="checkbox" id="tPoints"> <span data-i18n="scan">Arazi taraması (nokta bulutu)</span> <span class="meta" id="mPoints"></span></label>

  <div hidden>
    <div id="postOpts"><input type="checkbox" id="tPost" checked><input type="checkbox" id="tAO" checked><input type="checkbox" id="tBloom" checked><input type="checkbox" id="tHQ">

    <input type="checkbox" id="tShadow" checked>
    <button id="bMeasure"></button><button id="bClear"></button><div id="measureOut"></div>
    <div id="ver"></div><span id="sunAzEl"></span>
  </div>
  <div id="status" hidden></div>
</div>
<div id="hint"></div>
<div id="ptinfo"></div>
<button id="north" data-i18n-title="north" title="Kuzey (tıkla: üstten, kuzey yukarıda)"><svg viewBox="-30 -30 60 60">
  <g id="northRose">
    <circle r="26" fill="none" stroke="#5a6068" stroke-width="1"/>
    <path d="M0 -14 L5 1 L0 -1.5 L-5 1 Z" fill="#e0574f"/>
    <path d="M0 16 L5 1 L0 3.5 L-5 1 Z" fill="#9aa1aa"/>

  const s = sun.shadow.camera;
  sun.updateMatrixWorld(); sun.target.updateMatrixWorld();
  const low = 1 - Math.max(0, sunDir.y);   // grazing sun needs more normal offset
  if (mode === 'clay' || !houseBox) {
    s.left = -32; s.right = 32; s.top = 32; s.bottom = -32; s.near = 10; s.far = 200;
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03 + 0.03 * low;

    const b = houseBox.clone().expandByVector(new THREE.Vector3(9, 2, 9));
    const c = houseBox.getCenter(new THREE.Vector3());
    b.expandByPoint(new THREE.Vector3(c.x - 16, b.min.y, c.z - 16)).expandByPoint(new THREE.Vector3(c.x + 16, b.max.y, c.z + 16));
    const view = new THREE.Matrix4().lookAt(sun.position, sun.target.position, new THREE.Vector3(0, 1, 0));

      lb.expandByPoint(p);

    s.left = lb.min.x; s.right = lb.max.x; s.bottom = lb.min.y; s.top = lb.max.y;
    s.near = Math.max(0.5, -lb.max.z - 30); s.far = -lb.min.z + 5;

function enterWalk() {

  // stand on the ground below the current camera position (eye-level presets stay put)
  const p = camera.position.clone();
  const near = groundAt(p, EYE + 0.3);
  let gy = near;
  if (near === null || p.y - near > 4) {
    ray.set(new THREE.Vector3(p.x, p.y + 100, p.z), DOWN); ray.far = 400; ray.firstHitOnly = false;
    let hs = ray.intersectObjects(groundPickables(), false);

      const t = controls.target, dir = new THREE.Vector3(t.x - p.x, 0, t.z - p.z);
      const d = dir.length(); dir.normalize();

function walkStep(dt) {
  if (!walking) return;
  const speed = (keys.ShiftLeft || keys.ShiftRight) ? 5 : 1.8;
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (f || r) {
    plc.moveForward(f * speed * dt);
    plc.moveRight(r * speed * dt);

  if (keys.KeyE) camera.position.y += speed * dt;
  if (keys.KeyQ) camera.position.y -= speed * dt;

}

async function loadPoints() {
  if (pointsObj) return pointsObj;
  status(t('loadPoints')); $('mPoints').textContent = '...';
  const meta = await (await fetch('meta.json', { cache: 'no-store' })).json();
  const aligned = /colorized_plot_aligned/.test(meta.source || '');
  // share build: the points are published as base64 text (binary .bin files are not served)
  const b64 = await (await fetch('points.txt')).text();
  const bin = atob(b64.trim());
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const n = meta.count;
  const xyz = new Float32Array(buf.buffer, 0, n * 3);
  const rgb = new Uint8Array(buf.buffer, n * 12, n * 3);
  const [cx, cy, cz] = meta.centroid;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const x = xyz[3 * i] + cx, y = xyz[3 * i + 1] + cy, z = xyz[3 * i + 2] + cz;
    pos[3 * i] = x; pos[3 * i + 1] = z; pos[3 * i + 2] = -y;   // Blender Z-up -> three Y-up
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(rgb), 3, true));
  g.computeBoundingSphere();
  const m = new THREE.PointsMaterial({ size: +$('rPoint').value, vertexColors: true, sizeAttenuation: true });
  pointsObj = new THREE.Points(g, m);
  scene.add(pointsObj);
  $('mPoints').textContent = '';
  status(aligned ? 'Point cloud loaded (aligned frame)' : 'Warning: point cloud source is not the aligned LAS');
  return pointsObj;
}

function skyBackgroundEquirect() { return bgEquirect || (bgEquirect = captureEquirect(bgScene)); }

// flat ground overlays (road, driveway) sit within millimetres of the terrain: pull them forward in depth
const OVERLAY_RE = /road|asphalt|paver|driveway|travertine|tile/i;
function applyMaterialsForMode(root) {
  if (!root) return;
  root.traverse(o => {
    if (!o.isMesh || !o.userData.matFull) return;
    o.material = mode === 'clay' ? o.userData.matClay : o.userData.matFull;
    for (const m of [].concat(o.userData.matFull, o.userData.matClay)) {
      m.envMapIntensity = ENV_INT_RASTER;
      if (OVERLAY_RE.test(m.name || '')) { m.polygonOffset = true; m.polygonOffsetFactor = -2; m.polygonOffsetUnits = -8; }
    }
  });
  renderer.shadowMap.needsUpdate = true;
}

// post-processing (Rendered, and Path trace while moving)
// Default ("fast") targets 60 fps on an M4 Max: post chain at CSS-pixel resolution with 2x MSAA, GTAO at
// half resolution without the weed/grass meshes, bloom at half resolution.
// "High quality": post chain at device resolution (max 2), 4x MSAA, full-res GTAO incl. foliage, 16 samples.
const composerRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));   // user: sharper edges - full device resolution (AO/bloom stay half-res)
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.blendIntensity = 1.0;
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.1, 0.4, 1.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// user: "a little washed out" -> gentle S-curve + saturation in display space (after AgX + sRGB in OutputPass)
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, contrast: { value: 1.28 }, sat: { value: 1.16 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float contrast, sat; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 x = clamp(c.rgb, 0.0, 1.0);
      vec3 s = x * x * (3.0 - 2.0 * x); x = mix(x, s, contrast - 1.0) * 1.0;   // S-curve around mid grey
      x = (x - 0.5) * (1.0 + (contrast - 1.0) * 0.5) + 0.5;
      float l = dot(x, vec3(0.2126, 0.7152, 0.0722)); x = mix(vec3(l), x, sat);
      gl_FragColor = vec4(clamp(x, 0.0, 1.0), c.a); }`,
});
composer.addPass(gradePass);
const smaa = new SMAAPass(innerWidth * Math.min(devicePixelRatio, 2), innerHeight * Math.min(devicePixelRatio, 2));
composer.addPass(smaa);   // user: more anti-aliasing (on top of 4x MSAA)
let hq = false, effScale = 0.5;
for (const p of [gtao, bloom]) {
  const orig = p.setSize.bind(p);
  p.setSize = (w, h) => orig(Math.max(1, Math.round(w * effScale)), Math.max(1, Math.round(h * effScale)));
}
{
  const origRender = gtao.render.bind(gtao);
  const hidden = [];
  gtao.render = (...a) => {
    if (!hq && modelRoot) modelRoot.traverse(o => { if (o.isMesh && o.userData.foliage && o.visible) { o.visible = false; hidden.push(o); } });
    try { origRender(...a); } finally { for (const o of hidden) o.visible = true; hidden.length = 0; }
  };
}
function setQuality(high) {
  hq = high;
  effScale = hq ? 1 : 0.5;
  gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.0, scale: 1.0, samples: hq ? 16 : 8 });
  for (const t of [composer.renderTarget1, composer.renderTarget2]) { t.samples = 4; t.dispose(); }
  composer.setPixelRatio(Math.min(devicePixelRatio, 2));
  composer.setSize(innerWidth, innerHeight);
}
const usePost = () => $('tPost').checked;
function updatePost() {
  gtao.enabled = $('tAO').checked;
  bloom.enabled = $('tBloom').checked;
  $('tAO').disabled = $('tBloom').disabled = $('tHQ').disabled = !usePost();
}

// a close 3/4 view of the house for the lit modes (instead of the far aerial)
function closeView() {
  const names = viewsData ? Object.keys(viewsData.views) : [];
  return ['E_oblique', 'SE_closeup', 'SE_corner'].find(n => names.includes(n)) || 'aerial';
}

function setMode(m) {
  markActive();
  if (!['clay', 'rendered'].includes(m)) m = 'rendered';
  const wasClay = mode === 'clay';
  mode = m;
  try { localStorage.setItem('villaMode', m); } catch (_) {}
  for (const b of $('modes').children) b.classList.toggle('on', b.dataset.mode === m);
  const lit = m !== 'clay';
  $('postOpts').style.display = lit ? 'block' : 'none';
  clayDome.visible = !lit; skyMesh.visible = lit;
  scene.background = lit ? null : SKY;
  scene.environment = lit && envRT ? envRT.texture : null;
  scene.fog = lit ? fogLit : fogClay;
  applySunLight();
  renderer.toneMapping = lit ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = exposure[m];
  $('rExposure').value = exposure[m];
  fitShadow();
  applyMaterialsForMode(modelRoot);
  applyOpacity();
  $('ptinfo').style.display = m === 'pathtrace' ? 'block' : 'none';
  if (m === 'pathtrace') ptStart();
  updatePost();
  // switching the look keeps the camera where it is
}
setQuality(false);

let fpsN = 0, fpsT = performance.now();
window.__fps = 0;
function fpsTick() {
  fpsN++;
  const t = performance.now();
  if (t - fpsT > 500) {
    window.__fps = fpsN * 1000 / (t - fpsT);
    $('fps').textContent = window.__fps.toFixed(0) + ' fps';
    fpsN = 0; fpsT = t;
  }
}

// ---------------------------------------------------------------- path tracing
let ptLights = null;
let pt = null, ptBuilt = false, ptBuilding = false, ptLastMove = 0, ptFailed = false;
const PT_MAX_SAMPLES = 4000, PT_STILL_MS = 200;
const ptPrevW = new THREE.Matrix4(), ptPrevP = new THREE.Matrix4();
window.__ptSamples = 0;

canvas.addEventListener('webglcontextrestored', () => { pt = null; ptBuilt = false; ptFailed = false; envEquirect = null; updateSky(); if (mode === 'pathtrace') ptStart(); });
function ptInvalidate() { ptBuilt = false; if (mode === 'pathtrace') ptStart(); }
function ptInvalidateSamples() { if (pt) pt.ptr.reset(); }
function ptEnvUpdate() {
  const m = pt.ptr.material;
  m.envMapInfo.updateFrom(skyEquirect());
  m.backgroundMap = skyBackgroundEquirect();   // blue sky all round as the visible background
  m.environmentIntensity = ENV_INT;
  pt.ptr.reset();
}

async function ptStart() {
  if (ptBuilt || ptBuilding || !modelRoot || ptFailed) return;
  ptBuilding = true;
  const info = $('ptinfo');
  try {
    info.textContent = 'Path trace: loading library...';
    const PT = await import('three-gpu-pathtracer');
    if (!pt) {
      const ptr = new PT.PathTracingRenderer(renderer);
      ptr.material = new PT.PhysicalPathTracingMaterial();
      ptr.tiles.set(2, 2);       // 4 smaller draws per sample: keeps each GPU submission short (no watchdog resets)
      ptr.material.bounces = 5;
      ptr.material.transmissiveBounces = 8;
      ptr.material.filterGlossyFactor = 0.5;
      const quad = new FullScreenQuad(new THREE.MeshBasicMaterial({
        map: ptr.target.texture, blending: THREE.CustomBlending,
        premultipliedAlpha: renderer.getContextAttributes().premultipliedAlpha,
      }));
      pt = { PT, ptr, quad };
    }
    info.textContent = 'Path trace: building BVH (a few seconds)...';
    await new Promise(r => setTimeout(r, 50));
    const root = modelRoot;
    // the generator reads whatever material is on the mesh: make sure it is the textured set
    root.traverse(o => { if (o.isMesh && o.userData.matFull) o.material = o.userData.matFull; });
    const t0 = performance.now();
    const glass = [];
    root.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) if (m.userData.isGlass) glass.push(m); });
    const saved = glass.map(m => [m.transmission, m.transparent, m.opacity, m.color.clone()]);
    glass.forEach(m => { m.transmission = 1; m.transparent = false; m.opacity = 1; m.color.setRGB(0.82, 0.88, 0.9); });
    const res = new PT.PathTracingSceneGenerator().generate([root, sun]);
    if (mode === 'clay') applyMaterialsForMode(root);
    const { bvh, textures, materials, lights } = res;
    const g = bvh.geometry, m = pt.ptr.material;
    m.bvh.updateFrom(bvh);
    m.attributesArray.updateFrom(g.attributes.normal, g.attributes.tangent, g.attributes.uv, g.attributes.color);
    m.materialIndexAttribute.updateFrom(g.attributes.materialIndex);
    m.textures.setTextures(renderer, 1024, 1024, textures);
    m.materials.updateFrom(materials, textures);
    m.lights.updateFrom(lights); ptLights = lights;
    glass.forEach((g, i) => { [g.transmission, g.transparent, g.opacity] = saved[i]; g.color.copy(saved[i][3]); });
    ptEnvUpdate();
    if (root !== modelRoot) { ptBuilding = false; return ptStart(); }   // model hot-reloaded meanwhile
    ptBuilt = true;
    console.log(`path tracer scene: ${(g.index.count / 3 / 1e6).toFixed(2)} M tris, ${materials.length} materials, ` +
      `${textures.length} textures, built in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    info.textContent = 'Path trace: ready';
  } catch (err) {
    console.error(err);
    ptFailed = true;
    info.textContent = 'Path trace failed: ' + err.message + ' (showing Rendered)';
  }
  ptBuilding = false;
}

// returns true when it drew the path traced image this frame
function ptFrame() {
  if (!ptBuilt) { ptStart(); return false; }
  const ptr = pt.ptr;
  ptr.setSize(innerWidth, innerHeight);   // CSS-pixel resolution, upscaled on retina
  const now = performance.now();
  if (!ptPrevW.equals(camera.matrixWorld) || !ptPrevP.equals(camera.projectionMatrix)) {
    ptPrevW.copy(camera.matrixWorld); ptPrevP.copy(camera.projectionMatrix);
    ptr.reset(); ptLastMove = now;
  }
  if (now - ptLastMove < PT_STILL_MS) {
    $('ptinfo').textContent = 'Path trace: moving (raster preview)';
    window.__ptSamples = 0;
    return false;
  }
  camera.updateMatrixWorld();
  ptr.camera = camera;
  if (ptr.samples < PT_MAX_SAMPLES) for (let i = 0; i < 4; i++) ptr.update();
  window.__ptSamples = Math.floor(ptr.samples);
  if (ptr.samples < 1) return false;
  pt.quad.material.map = ptr.target.texture;
  renderer.setRenderTarget(null);
  const ac = renderer.autoClear; renderer.autoClear = false;
  renderer.clear();
  pt.quad.render(renderer);
  renderer.autoClear = ac;
  $('ptinfo').textContent = `Path trace: ${Math.floor(ptr.samples)} samples` + (ptr.samples >= PT_MAX_SAMPLES ? ' (done)' : '');
  return true;
}

// PNG of the next rendered frame (canvas only, no UI): await __viewer.snapshot()
const snapWaiters = [];
const snapshot = () => { const p = new Promise(r => snapWaiters.push(r)); if (document.hidden) step(); return p; };
window.__viewer = { snapshot, step, markActive, composer, gtao, bloom, setQuality, closeView, setMode, skyEquirect, northTopView,
  setSun: (week, minutes) => { if (week) sunState.week = week; if (minutes !== undefined) sunState.minutes = minutes; applySun({ immediate: true }); return { ...sunPos }; },
  get sunState() { return { ...sunState, ...sunPos }; }, camera, controls, renderer, sun, exposure, applyView: n => applyView(n, [...$('views').children].find(b => b.title === n)),
  get mode() { return mode; }, get pt() { return pt; }, get scene() { return scene; }, get model() { return modelRoot; } };

// ---------------------------------------------------------------- main
const clock = new THREE.Clock();
// Idle throttling: when nothing moves and nobody interacts for 2 s, raster modes redraw only once a second
// (the GPU stays free for other work); any input, UI change, camera motion or model reload wakes it up.
let lastActive = performance.now(), lastDraw = 0;
function markActive() { lastActive = performance.now(); }
for (const ev of ['pointerdown', 'pointermove', 'wheel', 'keydown', 'change', 'input', 'resize'])
  addEventListener(ev, markActive, { passive: true });
const idleCamW = new THREE.Matrix4(), idleCamP = new THREE.Matrix4();
function frame() {
  step();
  requestAnimationFrame(frame);
}
// one frame of work; also callable directly (__viewer.step) when the page is hidden and rAF is paused
function step() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!innerWidth || !innerHeight) return;
  sunPlayStep(dt);
  if (walking) walkStep(dt); else controls.update();
  camera.updateMatrixWorld();
  updateNorth();
  const now = performance.now();
  if (!idleCamW.equals(camera.matrixWorld) || !idleCamP.equals(camera.projectionMatrix)) {
    idleCamW.copy(camera.matrixWorld); idleCamP.copy(camera.projectionMatrix); markActive();
  }
  if (mode !== 'pathtrace' && !snapWaiters.length && !sunState.playing && now - lastActive > 2000 && now - lastDraw < 1000) {
    $('fps').textContent = 'idle'; return;
  }
  lastDraw = now;
  if (mode === 'pathtrace' && ptFrame()) { /* path traced image drawn */ }
  else if (mode === 'clay' || !usePost()) renderer.render(scene, camera);
  else composer.render(dt);
  labelRenderer.render(scene, camera);
  if (snapWaiters.length) { const w = snapWaiters.splice(0); canvas.toBlob(b => w.forEach(f => f(b)), 'image/png'); }
  fpsTick();
}

(async () => {
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  updateProjection();
  applyLang();
  try {
    const r = await fetch('model/version.txt', { cache: 'no-store' });
    version = r.ok ? (await r.text()).trim() : '';
    $('ver').textContent = version || 'no version.txt';
  } catch (_) { version = ''; }
  const qs = new URLSearchParams(location.search);
  const want = qs.get('mode');
  // sun: default = now (Istanbul); ?week=25&time=13:00 (or minutes) override for links / tests
  sunSetNow(); sunState.week = 39; sunState.minutes = 795;   // default: Thu 24 Sep 13:15
  if (qs.get('week')) sunState.week = Math.min(52, Math.max(1, Math.round(+qs.get('week')) || sunState.week));
  if (qs.get('time')) { const [h, m] = qs.get('time').split(':').map(Number); const v = m === undefined ? h : h * 60 + m; if (v >= 0 && v <= 1440) sunState.minutes = v; }
  sunUIReady = true;
  await loadGeoref();
  let saved = null; try { saved = localStorage.getItem('villaMode'); } catch (_) {}
  mode = 'rendered';   // user: only the realistic (high quality) look
  await loadViews();
  setMode(mode);
  if (!LOW_MEM) { setQuality(true); $('tHQ').checked = true; }   // user: high quality by default (phones keep half-res AO for speed)
  frame();
  // default camera: south-east, above the garage forecourt (the owner's chosen framing)
  shift = 0; camera.fov = 62; updateProjection();
  camera.position.set(6, 7.5, 11); controls.target.set(-12, 1, -6); camera.lookAt(controls.target); controls.update();
  try { await loadModel(); }
  catch (err) { console.error(err); $('load').textContent = t('loadFail') + (err && (err.message || err)) ; status(String(err)); }
  applyLang();
})();
</script>
